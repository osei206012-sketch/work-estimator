<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Estimator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0EA; --card:#FBFBF7; --ink:#17203A; --indigo:#27358A; --indigo-d:#1A2461;
  --gold:#E2AA2B; --line:#CDD1C6; --muted:#5F6878; --bad:#A8382A; --ok:#2E6A4E;
  --g-materials:#27358A; --g-labour:#2E6A4E; --g-equipment:#9A6200; --g-transport:#6B3FA0; --g-other:#7A8190;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:#FFF1D0;background:linear-gradient(165deg,#FFE9A8 0%,#FFD0E4 28%,#CFDCFF 60%,#BDF2DB 100%) fixed}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;margin:0;line-height:1.15}
h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
h2{font-size:19px;font-weight:800;margin-bottom:4px}
h4{font-size:14px;font-weight:600;margin:14px 0 4px}
p{margin:6px 0}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{padding:20px 0 18px;background:linear-gradient(120deg,#2B2A8F 0%,#7A2FC0 55%,#E4572E 100%);color:#fff;border-bottom:5px solid var(--gold)}
header h1{color:#fff}
header .wrap{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header p{color:rgba(255,255,255,.88);margin:4px 0 0;font-size:14px}
#curChip{flex:none;border:0;background:#fff;color:var(--indigo-d);font:700 14px "Public Sans",sans-serif;border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.18)}
nav.tabs{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid rgba(23,32,58,.12)}
nav.tabs .wrap{display:flex;overflow-x:auto;gap:2px;scrollbar-width:none}
nav.tabs button{flex:none;background:none;border:0;border-bottom:4px solid transparent;padding:12px 14px 9px;font:600 15px "Public Sans",sans-serif;color:var(--muted);cursor:pointer}
nav.tabs button.on{color:var(--indigo);border-bottom-color:var(--gold)}
main{padding-bottom:70px}
.blk{--accent:#7A2FC0;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.8);border-top:6px solid var(--accent);border-radius:12px;padding:14px;margin:14px 0}
#view>.blk:nth-of-type(4n+1){--accent:#7A2FC0}
#view>.blk:nth-of-type(4n+2){--accent:#E4572E}
#view>.blk:nth-of-type(4n+3){--accent:#0E9F7A}
#view>.blk:nth-of-type(4n){--accent:#E6A700}
.blk h2{color:var(--indigo-d)}
.hint,.note{color:var(--muted);font-size:13.5px}
.note{border-left:3px solid var(--gold);padding-left:10px;margin:10px 0}
.warn{border-left-color:var(--bad);color:var(--bad)}
label{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:3px}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.full{grid-column:1/-1}
@media(max-width:480px){.grid3{grid-template-columns:1fr 1fr}}
.btn{font:600 15px "Public Sans",sans-serif;background:linear-gradient(120deg,#2B2A8F,#7A2FC0);color:#fff;border:0;border-radius:8px;padding:11px 16px;cursor:pointer}
.btn.alt{background:transparent;color:var(--indigo);border:2px solid var(--indigo);padding:9px 14px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:6px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.ln{border-left:5px solid var(--g-materials);background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0 8px 8px 0;padding:10px;margin:8px 0}
.ln[data-g=labour]{border-left-color:var(--g-labour)}
.ln[data-g=equipment]{border-left-color:var(--g-equipment)}
.ln[data-g=transport]{border-left-color:var(--g-transport)}
.ln[data-g=other]{border-left-color:var(--g-other)}
.ln-top{display:flex;gap:8px;align-items:center}
.ln-top input{margin:0;font-weight:600}
.x{flex:none;width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:20px;line-height:1;color:var(--muted);cursor:pointer}
.ln-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
@media(max-width:520px){.ln-grid{grid-template-columns:1fr 1fr}}
.ln-foot{display:flex;align-items:center;gap:8px;margin-top:8px}
.ln-foot select{width:auto;margin:0;font-size:14px;padding:5px 8px}
.ln-foot .lt{margin-left:auto;font-variant-numeric:tabular-nums;font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.row b,.row .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.row .pct{width:64px;display:inline-block;margin:0 4px;padding:4px 6px;text-align:right}
.row.sub{border-bottom:1px solid var(--ink)}
.row.sub b{font-weight:800}
.total{background:linear-gradient(130deg,#1A2461 0%,#5B2A9E 60%,#B23A7E 100%);color:#fff;border-top:6px solid var(--gold);border-radius:10px;padding:16px;margin-top:14px}
.total small{color:#C9CFEF;display:block;font-size:13px}
.total .big{font:800 34px/1.1 "Bricolage Grotesque","Public Sans",sans-serif;font-variant-numeric:tabular-nums;margin:4px 0;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font:500 13.5px "Public Sans",sans-serif;color:var(--ink)}
button.chip{cursor:pointer}
button.chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
details.sec{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.8);border-left:6px solid #0E9F7A;border-radius:12px;margin:10px 0;padding:0 14px}
details.sec:nth-of-type(3n+2){border-left-color:#E4572E}
details.sec:nth-of-type(3n){border-left-color:#E6A700}
details.sec>summary{font:800 17px "Bricolage Grotesque","Public Sans",sans-serif;padding:14px 0;cursor:pointer;color:var(--indigo-d)}
details.cat{border-top:1px solid var(--line);padding:2px 0}
details.cat>summary{padding:11px 0;cursor:pointer;font-weight:600}
details.cat ul{margin:4px 0 8px;padding-left:20px;color:#2c354d}
details.cat .btn{margin:6px 0 12px}
.count{font:600 12px "Public Sans",sans-serif;color:var(--muted);margin-left:6px}
.item{border-bottom:1px dashed var(--line);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.item .meta{color:var(--muted);font-size:13px;grid-column:1/-1}
.item .p{font-variant-numeric:tabular-nums;font-weight:600}
.tag{display:inline-block;font:600 11.5px "Public Sans",sans-serif;border-radius:4px;padding:1px 6px;margin-left:6px;background:#F6E3B0;color:#6b4800}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
.rate-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.rate-row .eq{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.rate-row input{margin:0;width:120px}
.rate-row .nm small{display:block;color:var(--muted);font-size:12.5px;max-width:150px}
.conv-out{font:800 26px/1.2 "Bricolage Grotesque","Public Sans",sans-serif;font-variant-numeric:tabular-nums;margin:12px 0 2px;word-break:break-word}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1}
#printArea{display:none}
#printArea.open{display:block;position:fixed;inset:0;z-index:30;overflow:auto;background:rgba(23,32,58,.78)}
.qbar{position:sticky;top:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:#fff;border-bottom:3px solid var(--gold)}
.qbar .spacer{flex:1}
.qbar .btn{padding:9px 14px}
.qpaper{background:#fff;max-width:780px;margin:14px auto;padding:22px;border-radius:8px}
.qhint{max-width:780px;margin:0 auto 14px;color:#fff;font-size:13px;padding:0 14px}
.q{font:14px/1.45 "Public Sans",Arial,sans-serif;color:#000}
.q h1{font-size:26px;color:#2B2A8F;border-bottom:4px solid #E2AA2B;padding-bottom:6px}
.q table{width:100%;border-collapse:collapse;margin:12px 0}
.q th,.q td{border-bottom:1px solid #bbb;padding:5px 6px;text-align:left;vertical-align:top}
.q th{border-bottom:2px solid #2B2A8F;background:#EEF0FA}
.q .r{text-align:right;font-variant-numeric:tabular-nums}
.q .tot td{font-weight:700;border-top:2px solid #2B2A8F;background:#FFE9A8}
@media print{
  @page{margin:14mm}
  body>*:not(#printArea){display:none!important}
  #printArea:not(.open){display:none!important}
  #printArea.open{position:static;overflow:visible;background:#fff;display:block}
  .qbar,.qhint{display:none!important}
  .qpaper{max-width:none;margin:0;padding:0;border-radius:0}
  body{background:#fff!important}
  .q *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div>
      <h1>Work Estimator</h1>
      <p>Measure the job, price each item, and issue a quotation in any country.</p>
    </div>
    <button id="curChip" data-act="tab" data-tab="currency" aria-label="Country and currency. Open currency tab">GHS</button>
  </div>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="wrap" id="tabs">
    <button data-act="tab" data-tab="estimate">Estimate</button>
    <button data-act="tab" data-tab="catalogue">Catalogue</button>
    <button data-act="tab" data-tab="prices">Prices</button>
    <button data-act="tab" data-tab="currency">Currency</button>
    <button data-act="tab" data-tab="saved">Saved</button>
    <button data-act="tab" data-tab="feedback">Feedback</button>
    <button data-act="tab" data-tab="about">About</button>
    <button data-act="tab" data-tab="terms">Terms</button>
    <button data-act="tab" data-tab="privacy">Privacy</button>
    <button data-act="tab" data-tab="help">Help</button>
  </div>
</nav>

<main><div class="wrap" id="view"></div></main>

<datalist id="namelist"></datalist>
<div id="toast" role="status"></div>
<div id="printArea" role="dialog" aria-label="Quote preview">
  <div class="qbar">
    <button class="btn alt sm" data-act="closeQuote">Close</button>
    <span class="spacer"></span>
    <button class="btn alt sm" data-act="print">Print</button>
    <button class="btn sm" data-act="pdf">Save as PDF</button>
  </div>
  <div class="qpaper" id="qpaper"></div>
  <p class="qhint">Print opens your device's print dialog. Save as PDF creates a PDF file without using the print dialog. If nothing downloads inside this preview, open the app in your browser.</p>
</div>

function fmt(v,code){
  try{return new Intl.NumberFormat(undefined,{style:'currency',currency:code}).format(v)}
  catch(e){return code+' '+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
}
const hasRate=c=>!!S.r[c];
/* home-currency units per 1 unit of code, with the safety margin added for foreign quotes */
function basePer(code){
  if(code===S.base)return 1;
  if(!hasRate(code)||!hasRate(S.base))return 1;
  return S.r[S.base]/S.r[code]*(1+num(S.margin)/100);
}
function money(v,code=S.cur){return fmt(v/basePer(code),code)}
const baseMoney=v=>fmt(v,S.base);
function convert(amount,from,to){return(hasRate(from)&&hasRate(to))?amount*S.r[to]/S.r[from]:amount}

/* ---------- persistence (platform storage with browser fallback) ---------- */
const STORAGE_KEY='we-state';
let _pt;
function stateForStorage(){
  return JSON.stringify({country:S.country,countrySet:S.countrySet,base:S.base,cur:S.cur,margin:S.margin,r:S.r,ratesDate:S.ratesDate,watch:S.watch,prices:S.prices,saved:S.saved,seq:S.seq,est:S.est});
}
function persist(){
  clearTimeout(_pt);
  _pt=setTimeout(async()=>{
    const payload=stateForStorage();
    // Use the host-provided storage when available; fall back to browser storage.
    try{
      if(window.storage&&typeof window.storage.set==='function'){
        await window.storage.set(STORAGE_KEY,payload,false);
        return;
      }
    }catch(e){ /* Try localStorage below. */ }
    try{ window.localStorage.setItem(STORAGE_KEY,payload); }catch(e){ /* Storage may be blocked for file:// pages. */ }
  },600);
}
async function loadState(){
  let raw=null;
  try{
    if(window.storage&&typeof window.storage.get==='function'){
      const r=await window.storage.get(STORAGE_KEY);
      if(r&&typeof r.value==='string'&&r.value)raw=r.value;
    }
  }catch(e){ /* Try browser storage below. */ }
  if(!raw){
    try{ raw=window.localStorage.getItem(STORAGE_KEY); }catch(e){ /* Storage may be blocked for file:// pages. */ }
  }
  if(!raw)return;
  try{
    const d=JSON.parse(raw);
    ['country','countrySet','base','cur','margin','r','ratesDate','watch','prices','saved','seq'].forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});
    if(d.est){const b=newEstimate();S.est=Object.assign(b,d.est,{info:Object.assign(b.info,d.est.info||{}),cond:Object.assign(b.cond,d.est.cond||{})});}
  }catch(e){ /* Ignore corrupted or outdated saved state and start fresh. */ }
}

/* ---------- price book ---------- */
function lookupPrice(name,unit){
  const n=name.trim().toLowerCase(); if(!n)return null;
  let m=S.prices.filter(p=>p.cur===S.base&&p.name.toLowerCase()===n);
  if(unit)m=m.filter(p=>p.unit.toLowerCase()===unit.toLowerCase());
  if(!m.length)return null;
  const reg=S.est.info.region;
  m.sort((a,b)=>((b.region===reg)-(a.region===reg))||b.date.localeCompare(a.date));
  return m[0];
}
function refreshNameList(){
  const names=new Set();
  ALLCATS.forEach(c=>c.items.forEach(i=>names.add(i.name)));
  S.prices.forEach(p=>names.add(p.name));
  $('#namelist').innerHTML=[...names].sort().map(n=>`<option value="${esc(n)}">`).join('');
}

/* ---------- calculation ---------- */
function calc(){
  const e=S.est,g={materials:0,labour:0,equipment:0,transport:0,other:0};
  e.lines.forEach(l=>{l.total=num(l.qty)*(1+num(l.waste)/100)*num(l.rate);g[l.group]=(g[l.group]||0)+l.total});
  const direct=sum(g),oh=direct*num(e.overhead)/100,cont=direct*num(e.contingency)/100;
  const cost=direct+oh+cont,profit=cost*num(e.profit)/100,sub=cost+profit;
  const taxes=e.taxes.map(t=>({name:t.name,rate:t.rate,on:t.on,amt:t.on?sub*num(t.rate)/100:0}));
  const taxTotal=taxes.reduce((a,t)=>a+t.amt,0);
  return{g,direct,oh,cont,cost,profit,sub,taxes,taxTotal,final:sub+taxTotal};
}
function updateTotals(){
  if(S.tab!=='estimate')return;
  const c=calc(),set=(id,t)=>{const el=document.getElementById(id);if(el)el.textContent=t};
  S.est.lines.forEach(l=>set('lt-'+l.id,baseMoney(l.total)));
  Object.keys(GROUPS).forEach(k=>set('c-'+k,money(c.g[k])));
  set('c-direct',money(c.direct));set('c-oh',money(c.oh));set('c-cont',money(c.cont));
  set('c-cost',money(c.cost));set('c-profit',money(c.profit));set('c-sub',money(c.sub));
  c.taxes.forEach((t,i)=>set('tx-'+i,money(t.amt)));
  set('c-final',money(c.final));
  const foreign=S.cur!==S.base;
  set('c-final-base',foreign?`${baseMoney(c.final)} in ${S.base}`:'');
  set('c-rate',foreign?`Rate used: 1 ${S.cur} = ${baseMoney(basePer(S.cur))}`:'');
  persist();
}

/* ---------- quote / text output ---------- */
function buildQuote(){
  const e=S.est,c=calc(),code=S.cur,m=v=>money(v,code),i=e.info,k=e.cond;
  const rows=e.lines.filter(l=>num(l.qty)>0).map(l=>{
    const eff=num(l.rate)*(1+num(l.waste)/100);
    return `<tr><td>${esc(l.name)}</td><td class="r">${esc(l.qty)} ${esc(l.unit)}</td><td class="r">${m(eff)}</td><td class="r">${m(l.total)}</td></tr>`;
  }).join('');
  const markup=c.oh+c.cont+c.profit;
  const valid=num(k.validity)?`Valid for ${esc(k.validity)} days from ${esc(i.date)}.`:'';
  const cat=findCat(e.catId);
  const sec=(t,v)=>v?`<p><b>${t}:</b> ${esc(v)}</p>`:'';
  return `<div class="q">
    <h1>Quotation</h1>
    <p>Ref ${esc(e.ref)} &nbsp;|&nbsp; Date ${esc(i.date)} &nbsp;|&nbsp; Currency ${esc(code)}</p>
    <p><b>Customer:</b> ${esc(i.customer)||'-'} ${i.phone?'&nbsp;|&nbsp; '+esc(i.phone):''} ${i.email?'&nbsp;|&nbsp; '+esc(i.email):''}</p>
    <p><b>Project location:</b> ${esc([i.address,i.town,i.district,i.region,countryOf(e.country||S.country).name].filter(Boolean).join(', '))}</p>
    ${cat?`<p><b>Type of work:</b> ${esc(cat.name)}</p>`:''}
    ${sec('Description',i.desc)}
    <table><thead><tr><th>Item</th><th class="r">Quantity</th><th class="r">Unit rate</th><th class="r">Amount</th></tr></thead><tbody>
      ${rows||'<tr><td colspan="4">No priced items</td></tr>'}
      <tr><td colspan="3">Overheads, contingency and margin</td><td class="r">${m(markup)}</td></tr>
      <tr><td colspan="3"><b>Subtotal</b></td><td class="r"><b>${m(c.sub)}</b></td></tr>
      ${c.taxes.filter(t=>t.on).map(t=>`<tr><td colspan="3">${esc(t.name)} (${esc(t.rate)}%)</td><td class="r">${m(t.amt)}</td></tr>`).join('')}
      <tr class="tot"><td colspan="3">Total</td><td class="r">${m(c.final)}</td></tr>
    </tbody></table>
    ${code!==S.base?`<p>Equivalent: ${baseMoney(c.final)}. Rate used: 1 ${esc(code)} = ${baseMoney(basePer(code))}${S.ratesDate?' (rates set '+esc(S.ratesDate)+')':''}.</p>`:''}
    ${sec('Work included',k.included)}${sec('Work excluded',k.excluded)}${sec('Payment terms',k.payment)}${sec('Warranty',k.warranty)}${sec('Changes',k.change)}
    <p>${valid}</p>
    <p style="margin-top:30px">Customer approval: ____________________ &nbsp;&nbsp; Business approval: ____________________</p>
  </div>`;
}
function buildText(){
  const e=S.est,c=calc(),code=S.cur,m=v=>money(v,code),i=e.info;
  const L=[`QUOTATION ${e.ref}`,`Date: ${i.date}`,`Customer: ${i.customer||'-'}`,`Location: ${[i.address,i.town,i.district,i.region,countryOf(e.country||S.country).name].filter(Boolean).join(', ')}`,''];
  e.lines.filter(l=>num(l.qty)>0).forEach(l=>L.push(`${l.name}: ${l.qty} ${l.unit} x ${m(num(l.rate)*(1+num(l.waste)/100))} = ${m(l.total)}`));
  L.push('',`Subtotal: ${m(c.sub)}`);
  c.taxes.filter(t=>t.on).forEach(t=>L.push(`${t.name} (${t.rate}%): ${m(t.amt)}`));
  L.push(`TOTAL: ${m(c.final)}`);
  if(e.cond.payment)L.push('',`Payment: ${e.cond.payment}`);
  if(num(e.cond.validity))L.push(`Valid for ${e.cond.validity} days.`);
  return L.join('\n');
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Quote copied')).catch(()=>fallbackCopy(t))}else fallbackCopy(t);
}
function fallbackCopy(t){
  const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();
  try{document.execCommand('copy');toast('Quote copied')}catch(e){toast('Copy is not available here')}
  a.remove();
}

function runConv(){
  const a=$('#cv-amt');if(!a)return;
  const from=$('#cv-from').value,to=$('#cv-to').value;
  const amt=num(a.value),r=convert(amt,from,to);
  const f=v=>v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:v<10?4:2});
  const ok=hasRate(from)&&hasRate(to)||from===to;
  $('#cv-out').textContent=ok?`${f(amt)} ${from} = ${f(r)} ${to}`:'Rate needed';
  $('#cv-rate').textContent=ok?`1 ${from} = ${convert(1,from,to).toLocaleString(undefined,{maximumFractionDigits:6})} ${to}`:'Fetch live rates or enter a rate for the currencies you picked.';
}
async function fetchRates(){
  toast('Fetching rates…');
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/USD');
    const d=await r.json();
    if(d.result!=='success')throw new Error('bad');
    let n=0;
    Object.keys(d.rates).forEach(c=>{if(d.rates[c]>0){S.r[c]=d.rates[c];n++}});
    S.ratesDate=today();persist();renderCurrency();toast(`Updated ${n} currencies`);
  }catch(e){toast('Could not reach the rate service. Enter rates by hand.')}
}

/* The quote is drawn onto canvas pages, so every language and currency symbol renders correctly. */
function quotePages(){
  const e=S.est,c=calc(),code=S.cur,m=v=>money(v,code),i=e.info,k=e.cond;

function dataUrlToBytes(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let n=0;n<b.length;n++)a[n]=b.charCodeAt(n);return a}
function makePdfBlob(){
  const {pages,letter}=quotePages();
  const pw=letter?612:595,ph=letter?792:842;
  const jpegs=pages.map(cv=>({w:cv.width,h:cv.height,bytes:dataUrlToBytes(cv.toDataURL('image/jpeg',.92))}));
  const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
  const push=b=>{if(typeof b==='string')b=enc.encode(b);chunks.push(b);len+=b.length};
  const obj=(id,fn)=>{offs[id]=len;push(`${id} 0 obj\n`);fn();push('\nendobj\n')};
  const n=jpegs.length,total=3+3*n;
  push('%PDF-1.4\n');
  obj(1,()=>push('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2,()=>push(`<</Type/Pages/Count ${n}/Kids [${jpegs.map((_,i)=>`${3+3*i} 0 R`).join(' ')}]>>`));
  jpegs.forEach((j,i)=>{
    const pid=3+3*i,cid=4+3*i,iid=5+3*i,cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    obj(pid,()=>push(`<</Type/Page/Parent 2 0 R/MediaBox [0 0 ${pw} ${ph}]/Resources<</XObject<</Im0 ${iid} 0 R>>>>/Contents ${cid} 0 R>>`));
    obj(cid,()=>push(`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`));
    obj(iid,()=>{push(`<</Type/XObject/Subtype/Image/Width ${j.w}/Height ${j.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${j.bytes.length}>>\nstream\n`);push(j.bytes);push('\nendstream')});
  });
  const xr=len;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for(let id=1;id<total;id++)push(String(offs[id]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<</Size ${total}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(chunks,{type:'application/pdf'});
}
async function savePdf(){
  let blob;
  try{blob=makePdfBlob()}catch(err){toast('Could not build the PDF: '+err.message);return}
  const name=(S.est.ref||'quotation')+'.pdf';
  try{
    const file=new File([blob],name,{type:'application/pdf'});
    const touch=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(touch&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});return;
    }
  }catch(err){if(err&&err.name==='AbortError')return}
  try{
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),8000);
    toast('PDF saved as '+name);
  }catch(err){toast('Your browser blocked the download. Open the app in a browser tab.')}
}

    case'fetch':fetchRates();break;
    case'resetRates':S.r={...SAMPLE_PER_USD};S.ratesDate='';persist();renderCurrency();toast('Sample rates restored');break;
    case'swap':{const f=$('#cv-from'),t=$('#cv-to'),v=f.value;f.value=t.value;t.value=v;runConv();break}
    case'load':{
      const s=S.saved.find(x=>x.id===b.dataset.id);if(!s)break;
      const iso=s.est.country||S.country;
      if(iso!==S.country)setCountry(iso,{keepEstimate:true});
      const base=newEstimate();S.est=Object.assign(base,clone(s.est),{info:Object.assign(base.info,s.est.info),cond:Object.assign(base.cond,s.est.cond)});
      setTab('estimate');toast('Estimate opened');break;
    }
    case'delSaved':S.saved=S.saved.filter(s=>s.id!==b.dataset.id);persist();renderSaved();break;
  }
});

/* ---------- start ---------- */
(async function init(){
  await loadState();
  refreshNameList();
  setTab('estimate');
})();
</script>
</body>
</html>
